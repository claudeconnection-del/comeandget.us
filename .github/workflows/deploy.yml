name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supply chain: third-party actions are pinned to immutable commit SHAs (the
# trailing `# vN` is the human-readable tag). To bump one, re-resolve with
#   git ls-remote https://github.com/<owner>/<action> refs/tags/<vN>
# and update BOTH the SHA and its comment.

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: validate & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate HTML
        run: npm run validate
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      # Arm the local dev server (wrangler pages dev reads .dev.vars) with
      # THROWAWAY, test-only secrets so the presence/mirror recognition tests
      # actually run in CI instead of skipping or failing on a missing key.
      # These are NOT production secrets — the real SIGN_KEY is configured in
      # Cloudflare and used only at deploy/runtime, never here. .dev.vars is
      # gitignored, so this file exists only for the length of the CI job.
      - name: Arm dev-server test secrets (throwaway)
        run: printf 'SIGN_KEY=%s\n' "ci-smoke-not-a-real-secret-$(date +%s)" > .dev.vars
      - name: Smoke test the puzzle
        run: npm test
        env:
          # REQUIRED: the PUZZLE_ANSWER repo secret arms the "answers never ship"
          # leak guard. The guard is now FAIL-CLOSED in CI (tests/smoke.spec.js) —
          # if this secret is unset, the leak-guard tests ERROR rather than skip,
          # so no build can go green (and deploy) with the guard silently disabled.
          PUZZLE_ANSWER: ${{ secrets.PUZZLE_ANSWER }}

  deploy:
    name: deploy to cloudflare pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Deploy to Cloudflare Pages
        # Argument-free `pages deploy`: wrangler.toml decides the directory,
        # project name, and the PRESENCE KV binding. Uses the action's bundled
        # wrangler (recent enough for pages_build_output_dir — an ancient
        # wrangler is what trips "problem parsing the Wrangler configuration
        # file").
        #
        # NOTE: `wrangler pages deploy` does NOT auto-create a project — it errors
        # "Project not found". So create it first, idempotently: the `||` makes the
        # create a no-op once the project exists. Pinned wrangler is recent enough
        # for pages_build_output_dir.
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.0"
          preCommands: |
            npx wrangler pages project create comeandget-us --production-branch=main || echo "project comeandget-us already exists — continuing"
          command: pages deploy --commit-dirty=true
