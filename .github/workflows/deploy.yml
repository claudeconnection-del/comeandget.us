name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supply chain: third-party actions are pinned to immutable commit SHAs (the
# trailing `# vN` is the human-readable tag). To bump one, re-resolve with
#   git ls-remote https://github.com/<owner>/<action> refs/tags/<vN>
# and update BOTH the SHA and its comment.

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: validate & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate HTML
        run: npm run validate
      - name: Unit test the tools and functions
        run: npm run test:tools
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      # Arm the local dev server (wrangler pages dev reads .dev.vars) with
      # THROWAWAY, test-only secrets so the presence/mirror recognition tests
      # actually run in CI instead of skipping or failing on a missing key.
      # These are NOT production secrets — the real SIGN_KEY is configured in
      # Cloudflare and used only at deploy/runtime, never here. .dev.vars is
      # gitignored, so this file exists only for the length of the CI job.
      - name: Arm dev-server test secrets (throwaway)
        # SIGN_KEY arms the mirror/echo recognition tests; CODE_ARG1 arms the vigil
        # claim + server-side name/needle-rejection tests (claim.js compares the
        # submitted code to env.CODE_ARG1, so a throwaway that matches itself is
        # accepted). PROGRESS_REFRESH_SECONDS=0 makes the progress board recount on
        # every request instead of on its production interval, so the funnel tests
        # can assert that a walk moves the counts immediately.
        # Fixed literals so the test's readDevVar and the worker env
        # agree. Both are test-only — the real values live in Cloudflare.
        run: printf 'SIGN_KEY=%s\nCODE_ARG1=%s\nPROGRESS_REFRESH_SECONDS=%s\n' "ci-smoke-signing-key-not-real" "ci-smoke-claim-code" "0" > .dev.vars
      - name: Smoke test the puzzle
        run: npm test
        env:
          # REQUIRED: the PUZZLE_ANSWER repo secret arms the "answers never ship"
          # leak guard. The guard is FAIL-CLOSED in CI (tests/smoke.spec.js) —
          # if this secret is unset, the leak-guard tests ERROR rather than skip,
          # so no build can go green (and deploy) with the guard silently disabled.
          PUZZLE_ANSWER: ${{ secrets.PUZZLE_ANSWER }}

  deploy:
    name: deploy to cloudflare pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The deploy uses the SAME wrangler the tests just ran against — the one in
      # package-lock.json — so this repo has one wrangler version, bumped in one
      # place, instead of a second pin hidden inside a third-party action (the two
      # had already drifted: 3.114.0 in the action, 3.114.17 in the lock).
      #
      # Argument-free `pages deploy`: wrangler.toml decides the directory, project
      # name, and the PRESENCE KV binding. Never pass a positional directory — it
      # conflicts with pages_build_output_dir.
      #
      # `wrangler pages deploy` does NOT auto-create a project — it errors "Project
      # not found" — so create it first, idempotently: the `||` makes the create a
      # no-op once the project exists.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create comeandget-us --production-branch=main || echo "project comeandget-us already exists — continuing"
          npx wrangler pages deploy --commit-dirty=true
